[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
verbosity = 1

# PRD: fuzz/invariant tests first-class. Keep the default profile fast enough
# for local iteration, crank it in CI.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 128
fail_on_revert = false

[profile.ci]
fuzz = { runs = 1000 }
invariant = { runs = 512, depth = 256 }

# See more config options:
# https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
