name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Routes match the tree
        # The API surface is a generated table; this fails if a route module
        # exists but was never mounted (or vice versa).
        run: pnpm check:routes

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract tests
        # 130+ tests incl. the audit regressions and the EIP-170 size guard.
        run: pnpm --filter @openlance/contracts test

      - name: API invariant checks (no database)
        run: |
          pnpm --filter @openlance/api check:funding-match
          pnpm --filter @openlance/api check:sponsorable
          pnpm --filter @openlance/api check:webhook-url
          pnpm --filter @openlance/api check:cron
          pnpm --filter @openlance/api check:kv

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholder — no DB is contacted during the build.
          SUPABASE_JWT_SECRET: ci-placeholder-secret-not-used-in-prod-000
          NEXT_PUBLIC_API_BASE: http://localhost:4000
